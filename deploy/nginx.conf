# Web container: serves the Vite build and forwards /api + /admin to Django,
# so the stack exposes a single HTTP endpoint (:8080) to the outside proxy.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's embedded DNS, resolved per request: nginx starts even if api is down.
    resolver 127.0.0.11 valid=10s;
    set $api http://tallybiz-api:8000;

    location ~ ^/(api|admin)/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed filenames: safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
